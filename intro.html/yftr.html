<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background-image: url("1.jpg");
        background-repeat: no-repeat; 
        background-position: center;
        background-size: cover; 
      }
      .webs {
        flex-direction: column;
        display: flex;
        gap: 15px;
        width: fit-content;
        margin: auto;
        
      }
      .web {
        justify-content: center;
        align-items: center;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        border: none;
        background-color: white;
        border-radius: 10px;
      }
      .dew {
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        background-color: white;
        border: none;
        border-radius: 10px;
      }
      .man {
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        background-color: white;
        border: none;
        border-radius: 10px;
      }
      .button-sign {
      background-color: rgb(29, 29, 182);
      color: white;
      padding-bottom: 10px;
      padding-top: 10px;
      border: none;
      border-radius: 10px;
      font-size:15px;
      cursor: pointer;
      
      }
      .button-sign:hover {
       background-color: rgb(47, 47, 161);
       box-shadow: 5px 5px 8px black;
      }
      .button-sign:active {
        background-color: rgb(74, 74, 160);
      }
      .create {
        text-align: center;
        color: white;
      }
      .color-des {
        background-color: rgba(25, 27, 34, 0.74);
        border-radius: 20px;
        padding-bottom: 10px;
        width: 350px;
        margin-left: 170px;
        padding-left: 20px;
        padding-right: 20px;
        margin-top: 90px;
        padding-bottom: 20px;
        margin-left: 120px;
      }
    </style>
  </head>
  <body>
    <div class="color-des">
    <h1 class="create">Create an account.</h1>
    <form class="webs">
   <input class="web" type="text" autocomplete="name" placeholder="Enter your name" required> 
   <input class="dew" type="email" autocomplete="email" placeholder="Enter your email address" required>
   <input class="man" type="password" autocomplete="new-password" placeholder="Enter your password">
   <button class="button-sign" type="submit">Sign up</button>
   </form>
   </div>
  </body>
</html>
