<!DOCTYPE html>
<html>
      <head>
      <title>flex-box</title>
      <style>
            .flex-1 {
                  background-color: blue;
            }
              .flex-2 {
                  background-color: grey;
            }  .flex-3 {
                  background-color: green;

            }
            .header {
                  display: flex;
                  justify-content: space-between                   ;
            }
      </style>
      </head>
      <body>
        <div class="header">
        <div class="flex-1">
            flex-1
        </div>
        <div class="flex-2">
            flex-2
        </div>
        <div class="flex-3">
            flex-3
        </div>
        </div>
      </body>
</html>
