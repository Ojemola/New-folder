<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f4f7fb;
      }

      .form-card {
        background: #ffffff;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(35, 45, 55, 0.12);
        width: min(100%, 380px);
        box-sizing: border-box;
      }

      .form-card h1 {
        margin: 0 0 20px;
        font-size: 22px;
        color: #17212b;
      }

      .field {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 14px;
        border: 1px solid rgba(209, 219, 219, 0.9);
        border-radius: 10px;
        font-size: 15px;
        color: #0c1d1b;
        box-sizing: border-box;
      }

      .button-row {
        display: flex;
        justify-content: center;
      }

      .sign {
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 14px 32px;
        font-size: 16px;
        cursor: pointer;
        transition: opacity 0.2s ease, box-shadow 0.2s ease;
      }

      .sign:hover {
        opacity: 0.85;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
      }

      .sign:active {
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <form class="form-card" action="#" method="post">
      <h1>Create an account</h1>
      <input class="field" type="text" name="first_name" placeholder="First name" required>
      <input class="field" type="text" name="last_name" placeholder="Last name" required>
      <input class="field" type="email" name="email" placeholder="Email" required>
      <input class="field" type="password" name="password" placeholder="Enter your password" required>
      <div class="button-row">
        <button class="sign" type="submit">Sign up</button>
      </div>
    </form>
  </body>
</html>
